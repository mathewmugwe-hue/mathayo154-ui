<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mathayo 154 Predictive Model</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
    .card { background: #1e293b; padding: 24px; border-radius: 12px; max-width: 650px; margin: 20px auto; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); }
    h2 { margin-top: 0; color: #38bdf8; text-align: center; }
    textarea { width: 100%; height: 120px; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; padding: 10px; box-sizing: border-box; font-family: monospace; font-size: 13px; }
    .btn { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 12px; }
    .btn:hover { background: #1d4ed8; }
    pre { background: #0f172a; padding: 16px; border-radius: 6px; border: 1px solid #334155; white-space: pre-wrap; font-size: 13px; overflow-x: auto; margin-top: 20px; color: #4ade80; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Mathayo 154 Model</h2>
    <p style="text-align: center; color: #94a3b8;">Daily Fixture Odds Processor</p>
    
    <label style="font-size: 14px; color: #cbd5e1; display: block; margin-bottom: 6px;">Paste Daily Matches (Format: Home, Away, HomeOdds, DrawOdds, AwayOdds):</label>
    <textarea id="matchData" placeholder="Arsenal, Chelsea, 1.80, 3.60, 4.50&#10;Real Madrid, Barcelona, 2.10, 3.40, 3.20"></textarea>
    
    <button class="btn" onclick="processMatches()">Calculate Fair Probabilities</button>
    <pre id="output">Results will appear here...</pre>
  </div>

  <script>
    async function processMatches() {
      const outputEl = document.getElementById('output');
      const text = document.getElementById('matchData').value.trim();
      if (!text) {
        outputEl.textContent = 'Please paste at least one match fixture line.';
        return;
      }

      outputEl.textContent = 'Processing matches with Render engine...';
      const lines = text.split('\n');
      const results = [];

      for (let line of lines) {
        const parts = line.split(',').map(s => s.trim());
        if (parts.length >= 5) {
          const [home, away, hOdds, dOdds, aOdds] = parts;
          try {
            const url = `https://mathayo-backend.onrender.com/predict?home_team=${encodeURIComponent(home)}&away_team=${encodeURIComponent(away)}&home_odds=${hOdds}&draw_odds=${dOdds}&away_odds=${aOdds}`;
            const res = await fetch(url);
            const data = await res.json();
            results.push(data);
          } catch (err) {
            results.push({ error: `Failed to calculate ${home} vs ${away}` });
          }
        }
      }

      outputEl.textContent = JSON.stringify(results, null, 2);
    }
  </script>
</body>
</html>
