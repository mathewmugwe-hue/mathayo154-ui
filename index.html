<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mathayo 154 Predictive Model</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
    .card { background: #1e293b; padding: 24px; border-radius: 12px; max-width: 480px; margin: 40px auto; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); }
    h2 { margin-top: 0; color: #38bdf8; text-align: center; }
    .btn { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.2s; }
    .btn:hover { background: #1d4ed8; }
    pre { background: #0f172a; padding: 16px; border-radius: 6px; border: 1px solid #334155; white-space: pre-wrap; font-size: 14px; overflow-x: auto; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Mathayo 154 Model</h2>
    <p style="text-align: center; color: #94a3b8;">Deterministic Probability Engine</p>
    <button class="btn" onclick="runPrediction()">Fetch Live Match Analysis</button>
    <pre id="output">Click the button to fetch live calculations from your cloud engine...</pre>
  </div>

  <script>
    async function runPrediction() {
      const outputEl = document.getElementById('output');
      outputEl.textContent = 'Connecting to Render backend engine...';
      
      try {
        const response = await fetch('https://mathayo-backend.onrender.com/predict?home_team=Arsenal&away_team=Chelsea&home_odds=1.80&draw_odds=3.60&away_odds=4.50');
        const data = await response.json();
        outputEl.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        outputEl.textContent = 'Error fetching data. Ensure your Render backend is running.\n\n' + error;
      }
    }
  </script>
</body>
</html>
