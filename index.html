<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mathayo 154 Genius Model - v3.4 Engine</title>
  <!-- Tesseract.js for Real Screenshot OCR -->
  <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
    .card { background: #1e293b; padding: 24px; border-radius: 12px; max-width: 900px; margin: 20px auto; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); }
    h2 { margin-top: 0; color: #38bdf8; text-align: center; }
    textarea { width: 100%; height: 150px; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; padding: 10px; box-sizing: border-box; font-family: monospace; font-size: 12px; }
    .dropzone { border: 2px dashed #334155; padding: 20px; text-align: center; border-radius: 6px; background: #0f172a; cursor: pointer; margin-top: 15px; color: #94a3b8; transition: 0.2s; }
    .dropzone:hover { border-color: #38bdf8; color: #f8fafc; }
    .btn { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 15px; transition: 0.2s; }
    .btn:hover { background: #1d4ed8; }
    .result-box { background: #0f172a; padding: 16px; border-radius: 6px; border: 1px solid #334155; margin-top: 20px; max-height: 500px; overflow-y: auto; }
    .match-item { border-bottom: 1px solid #334155; padding: 14px 0; }
    .match-item:last-child { border-bottom: none; }
    .meta { color: #38bdf8; font-size: 13px; font-weight: bold; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-left: 6px; }
    .badge-play { background: #166534; color: #4ade80; }
    .badge-noplay { background: #7f1d1d; color: #fca5a5; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Mathayo 154 Genius Model (v3.4)</h2>
    <p style="text-align: center; color: #94a3b8;">Multi-Format Sportsbook OCR & Independent Valuation Engine</p>
    
    <label style="font-size: 14px; color: #cbd5e1; display: block; margin-bottom: 6px;">Paste Fixtures/Odds Data or Use Screenshot Reader:</label>
    <textarea id="matchData" placeholder="Paste text dumps or sportsbook layouts here...&#10;Example: Hoffenheim vs Stuttgart or vertical odds lists"></textarea>
    
    <div class="dropzone" onclick="document.getElementById('fileInput').click()">
      📸 Drop or Click Screenshot to Scan Pixels (Powered by Tesseract OCR)
      <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="processScreenshot(event)">
    </div>
    
    <button class="btn" onclick="processMatches()">Run v3.4 Model Analysis</button>
    <div id="output" class="result-box">Structured analysis results will appear here...</div>
  </div>

  <script>
    async function processScreenshot(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      const outputEl = document.getElementById('output');
      outputEl.innerHTML = `<span style="color: #38bdf8;">Scanning screenshot pixels with OCR engine... Please wait.</span>`;
      
      try {
        const { data: { text } } = await Tesseract.recognize(file, 'eng', {
          logger: m => { if(m.status === 'recognizing text') outputEl.innerHTML = `<span style="color: #38bdf8;">OCR Progress: ${Math.round(m.progress * 100)}%</span>`; }
        });
        
        document.getElementById('matchData').value = text;
        outputEl.innerHTML = `<span style="color: #4ade80;">OCR Scan Complete! Raw text extracted into textarea. Click 'Run v3.4 Model Analysis' to process.</span>`;
      } catch (err) {
        outputEl.innerHTML = `<span style="color: #ef4444;">OCR Scan Failed: ${err.message}</span>`;
      }
    }

    async function processMatches() {
      const outputEl = document.getElementById('output');
      const text = document.getElementById('matchData').value.trim();
      if (!text) {
        outputEl.innerHTML = '<span style="color: #ef4444;">Please provide match text or upload a screenshot first.</span>';
        return;
      }

      outputEl.innerHTML = 'Parsing entries and executing v3.4 backend pipeline...';
      const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
      let parsedMatches = [];

      let i = 0;
      while (i < lines.length) {
        let line = lines[i];

        // Format 1: Comma separated (TeamA, TeamB, HomeOdds, DrawOdds, AwayOdds)
        if (line.includes(',')) {
          let parts = line.split(',').map(s => s.trim());
          if (parts.length >= 5) {
            let homeName = parts[0].replace(/\s+[Cc]$/, '').trim();
            let awayName = parts[1].replace(/\s+[Cc]$/, '').trim();
            parsedMatches.push({ home: homeName, away: awayName, h: parts[2], d: parts[3], a: parts[4] });
          }
          i++;
          continue;
        }

        // Format 2: Sportsbook Jackpots / Vertical Blocks (Team on line i, Team on line i+1, followed by odds or ID tags)
        if (i + 4 < lines.length) {
          let potentialHome = lines[i];
          let potentialAway = lines[i+1];
          
          let oddsCandidates = [];
          for (let j = i + 2; j < i + 8 && j < lines.length; j++) {
            let val = parseFloat(lines[j]);
            if (!isNaN(val) && val > 1.0 && val < 50.0) {
              oddsCandidates.push(lines[j]);
            }
          }

          if (oddsCandidates.length >= 3 && !potentialHome.includes("ID:") && !potentialHome.includes("Market")) {
            let homeName = potentialHome.replace(/\s+[Cc]$/, '').trim();
            let awayName = potentialAway.replace(/\s+[Cc]$/, '').trim();
            parsedMatches.push({ home: homeName, away: awayName, h: oddsCandidates[0], d: oddsCandidates[1], a: oddsCandidates[2] });
            i += 4; 
            continue;
          }
        }

        // Format 3: Inline vs format ("TeamA vs TeamB")
        if (line.toLowerCase().includes(' vs ')) {
          let teams = line.split(/vs/i).map(s => s.trim());
          if (teams.length >= 2) {
            parsedMatches.push({ home: teams[0].replace(/\s+[Cc]$/, '').trim(), away: teams[1].replace(/\s+[Cc]$/, '').trim(), h: "2.20", d: "3.40", a: "3.10" });
          }
        }

        i++;
      }

      if (parsedMatches.length === 0) {
        outputEl.innerHTML = `<span style="color: #ef4444;">Could not isolate match items automatically. Please paste in format: <strong>TeamA vs TeamB</strong></span>`;
        return;
      }

      let html = '';
      for (let m of parsedMatches) {
        try {
          const url = `https://mathayo-backend.onrender.com/predict?home_team=${encodeURIComponent(m.home)}&away_team=${encodeURIComponent(m.away)}&home_odds=${m.h}&draw_odds=${m.d}&away_odds=${m.a}`;
          const res = await fetch(url);
          const data = await res.json();
          
          let isPlay = data.verdict && data.verdict.startsWith("RECOMMENDED PLAY");
          let badgeClass = isPlay ? "badge-play" : "badge-noplay";
          
          let outcomesHtml = '';
          if (data.outcomes) {
            outcomesHtml = data.outcomes.map(o => 
              `<div>• ${o.market}: Model <strong>${o.model_prob_pct}%</strong> vs Mkt <strong>${o.market_prob_pct}%</strong> | Edge: <span style="color: ${o.edge_pct >= 0 ? '#4ade80' : '#ef4444'}">${o.edge_pct}%</span> | Kelly: <strong>${o.suggested_stake_pct_bankroll || 0}%</strong></div>`
            ).join('');
          }

          html += `
            <div class="match-item">
              <span class="meta">${data.match || (m.home + ' vs ' + m.away)}</span> 
              <span class="badge ${badgeClass}">${data.safety_grade || 'ANALYZED'}</span><br>
              <div style="margin-top: 6px; font-size: 13px;">${outcomesHtml}</div>
              <small style="color: #94a3b8; display: block; margin-top: 4px;">xG [H|A]: ${JSON.stringify(data.calculated_xG_detail || data.calculated_xG)} | Margin: ${data.market_margin_pct}%</small>
            </div>
          `;
        } catch (err) {
          html += `<div class="match-item" style="color: #ef4444;">Error calculating ${m.home} vs ${m.away}</div>`;
        }
      }

      outputEl.innerHTML = html;
    }
  </script>
</body>
</html>
